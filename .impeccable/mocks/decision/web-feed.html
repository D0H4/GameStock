<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>숏폼 뉴스 피드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--p1:#15131C;--line:#2A2733;--ink:#fff;--mute:#A8A4B4;--pink:#FD5886;--up:#FF4D5E;--dn:#5B86FF}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;background:var(--bg);color:var(--ink);font:500 13px/1.4 "Noto Sans KR",sans-serif;font-variant-numeric:tabular-nums;display:grid;grid-template-columns:220px 1fr 380px}
.rail{border-right:1px solid var(--line);padding:20px 18px;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:900;font-size:18px;display:flex;gap:8px;align-items:center;margin-bottom:24px}.logo i{width:24px;height:24px;background:var(--pink);border-radius:6px}
.rail span{padding:10px 12px;border-radius:8px;color:var(--mute);font-size:15px}.rail .on{background:var(--p1);color:var(--ink)}
.stage{display:flex;justify-content:center;align-items:center;gap:20px;background:#0A0910}
.card{width:470px;height:840px;border-radius:16px;position:relative;overflow:hidden;background:#3B2A55}
.art{position:absolute;inset:0;background:#4A3570}
.art::after{content:"[캐릭터 일러스트: public/characters]";position:absolute;top:38%;left:0;right:0;text-align:center;color:#CFC2E8;font-size:14px}
.cap{position:absolute;left:0;right:0;bottom:0;background:#000;padding:22px 84px 22px 22px}
.src{color:var(--mute);font-size:12px;margin-bottom:8px}
.cap h2{font-size:26px;font-weight:900;line-height:1.3;margin-bottom:14px}
.mini{display:flex;align-items:center;gap:14px;background:var(--p1);border-radius:10px;padding:10px 12px}
.mini b{font-size:18px}.u{color:var(--up)}.d{color:var(--dn)}
.act{position:absolute;right:14px;bottom:30px;display:flex;flex-direction:column;gap:14px;align-items:center}
.act span{width:52px;height:52px;border-radius:50%;background:#ffffff1f;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.act .buy{background:var(--up)}.act .sell{background:var(--dn)}
.peek{width:60px;height:700px;border-radius:12px;background:#2A1F3A;opacity:.5}
.side{border-left:1px solid var(--line);padding:20px}
.side h3{font-size:13px;color:var(--mute);font-weight:500;margin:6px 0 12px}
.big{font-size:44px;font-weight:900;line-height:1}
.li{display:grid;grid-template-columns:1fr auto;padding:10px 0;border-bottom:1px solid var(--line)}
</style></head><body>
<nav class="rail"><div class="logo"><i></i>슈엔증권</div><span>홈</span><span>거래</span><span class="on">속보</span><span>랭킹</span><span>내 계좌</span></nav>
<main class="stage"><div class="peek"></div>
<article class="card"><div class="art"></div>
<div class="cap"><div class="src">게임메카 · 14:02 · 영향 +0.8</div><h2>'우마무스메' 신규 육성 시나리오 공개, 사전 예약 개시</h2>
<div class="mini"><span>UMA</span><svg width="150" height="36" viewBox="0 0 150 36"><polyline fill="none" stroke="#FF4D5E" stroke-width="2" points="0,26 30,28 60,30 75,22 100,16 125,12 150,8"/><circle cx="60" cy="30" r="4" fill="#fff" stroke="#000" stroke-width="2"/></svg><b>₩10,590</b><span class="u">+0.09%</span></div></div>
<div class="act"><span class="buy">매수</span><span class="sell">매도</span><span>관심</span><span>원문</span></div></article>
<div class="peek"></div></main>
<aside class="side"><h3>게임주 지수</h3><div class="big">1,013.73</div><div class="u" style="font-size:18px;margin:4px 0 22px">▲ 1.37%</div>
<h3>이 뉴스 이후 많이 움직인 종목</h3>
<div class="li"><span>발로란트</span><span class="u">+17.09%</span></div><div class="li"><span>에픽세븐</span><span class="u">+17.85%</span></div><div class="li"><span>쿠키런: 킹덤</span><span class="u">+15.90%</span></div><div class="li"><span>승리의 여신: 니케</span><span class="d">-1.19%</span></div></aside>
</body></html>
