<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#0E0B10;color:#fff;font-family:"Noto Sans KR",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.art{position:absolute;inset:0 0 83px 0;background:linear-gradient(160deg,#9BD3F5 0%,#6FA8E8 40%,#3D4E9E 75%,#1A1530 100%)}
.art .fig{position:absolute;left:70px;top:150px;width:250px;height:420px;border-radius:125px 125px 30px 30px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:13px;color:rgba(255,255,255,.8)}
.scrim{position:absolute;left:0;right:0;bottom:83px;height:380px;background:linear-gradient(transparent,rgba(14,11,16,.92))}
.top{position:absolute;top:0;left:0;right:0;padding:56px 16px 0;display:flex;justify-content:space-between;align-items:center}
.top b{font-size:17px}
.top span{font-size:12px;background:rgba(0,0,0,.35);padding:4px 9px;border-radius:12px}
.prog{position:absolute;top:96px;left:16px;right:16px;display:flex;gap:4px}
.prog i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
.prog i.on{background:#fff}
.info{position:absolute;left:16px;right:84px;bottom:110px}
.chip{display:inline-block;font-size:11px;font-weight:700;background:#E23A3A;padding:2px 7px;border-radius:4px;margin-bottom:8px}
.info h2{font-size:15px;font-weight:500;opacity:.85}
.info .px{font-size:40px;font-weight:900;letter-spacing:-1px;line-height:1.1}
.info .ch{font-size:17px;font-weight:700;color:#FF8A8A}
.info p{font-size:13.5px;line-height:1.5;margin-top:10px;opacity:.9}
.info p u{text-decoration:none;font-weight:700}
.rail{position:absolute;right:12px;bottom:118px;display:flex;flex-direction:column;gap:18px;align-items:center}
.rail div{text-align:center;font-size:11px}
.rail i{display:block;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);margin-bottom:4px;border:1.5px solid rgba(255,255,255,.6)}
.rail .buy i{background:#FD5886;border-color:#FD5886}
.tab{position:absolute;bottom:0;left:0;width:390px;height:83px;background:#0E0B10;border-top:1px solid #2A2430;display:flex;padding-top:8px}
.tab div{flex:1;text-align:center;font-size:10.5px;color:#8A8492}
.tab div i{display:block;width:24px;height:24px;margin:0 auto 3px;border-radius:6px;border:2px solid #5A5462}
.tab .on{color:#FD5886;font-weight:700}.tab .on i{border-color:#FD5886}
</style></head><body>
<div class="art"><div class="fig">캐릭터 일러스트 판</div></div>
<div class="scrim"></div>
<div class="top"><b>오늘 움직인 종목</b><span>게임주 지수 ▲ 2.31%</span></div>
<div class="prog"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="info">
  <span class="chip">VI 발동</span>
  <h2>블루 아카이브 · BA</h2>
  <div class="px">48,250원</div>
  <div class="ch">▲ 5,330 (+12.42%)</div>
  <p><u>뉴스 ▲▲</u> 3.5주년 방송에서 신규 학생 발표. 이후 이용자 매수 62%, 매수 잔량이 1.8배입니다.</p>
</div>
<div class="rail">
  <div><i></i>관심</div>
  <div class="buy"><i></i>주문</div>
  <div><i></i>뉴스 3</div>
  <div><i></i>호가</div>
</div>
<div class="tab"><div class="on"><i></i>홈</div><div><i></i>시장</div><div><i></i>뉴스</div><div><i></i>랭킹</div><div><i></i>내 계좌</div></div>
</body></html>
