<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#F2F4F6;color:#191F28;font-family:"Noto Sans KR",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.sb{height:47px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 6px;font-size:15px;font-weight:700;background:#fff}
.hd{background:#fff;padding:10px 20px 14px;font-size:20px;font-weight:700}
.card{background:#fff;margin:10px 12px 0;border-radius:18px;padding:18px 20px}
.card .k{font-size:14px;color:#6B7684}
.card .v{font-size:28px;font-weight:700;margin-top:4px}
.up{color:#F04452}.down{color:#3182F6}
.chips{display:flex;gap:8px;margin-top:14px}
.chips div{flex:1;background:#F2F4F6;border-radius:12px;padding:10px 12px;font-size:12px;color:#6B7684}
.chips b{display:block;font-size:15px;color:#191F28}
.ttl{font-size:17px;font-weight:700;margin-bottom:8px}
.r{display:flex;align-items:center;gap:12px;height:58px}
.r .rk{width:16px;font-size:15px;font-weight:700;color:#3182F6}
.r .ic{width:38px;height:38px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.r .nm{font-size:16px;font-weight:500}
.r .rt{margin-left:auto;text-align:right}
.r .rt b{display:block;font-size:16px}
.r .rt span{font-size:13px}
.tab{position:absolute;bottom:0;left:0;width:390px;height:83px;background:#fff;border-top:1px solid #E5E8EB;display:flex;padding-top:8px}
.tab div{flex:1;text-align:center;font-size:10.5px;color:#8B95A1}
.tab div i{display:block;width:24px;height:24px;margin:0 auto 3px;border-radius:6px;background:#D1D6DB}
.tab .on{color:#191F28;font-weight:700}.tab .on i{background:#191F28}
</style></head><body>
<div class="sb"><span>14:32</span><span>5G ▮▮▮</span></div>
<div class="hd">슈엔증권</div>
<div class="card">
  <div class="k">내 총 자산</div>
  <div class="v">1,248,300원</div>
  <div class="up" style="font-size:15px;font-weight:500">+24,300원 (1.98%)</div>
  <div class="chips"><div>게임주 지수<b class="up">1,284.62 +2.31%</b></div><div>상승 · 하락<b>9 · 5</b></div></div>
</div>
<div class="card">
  <div class="ttl">실시간 인기 종목</div>
  <div class="r"><span class="rk">1</span><div class="ic" style="background:#7EC4F0">BA</div><span class="nm">블루 아카이브</span><div class="rt"><b>48,250원</b><span class="up">+12.42%</span></div></div>
  <div class="r"><span class="rk">2</span><div class="ic" style="background:#F08BB0">UMA</div><span class="nm">우마무스메</span><div class="rt"><b>31,900원</b><span class="up">+6.83%</span></div></div>
  <div class="r"><span class="rk">3</span><div class="ic" style="background:#5B8DD6">GI</div><span class="nm">원신</span><div class="rt"><b>54,300원</b><span class="down">−4.18%</span></div></div>
  <div class="r"><span class="rk">4</span><div class="ic" style="background:#3A3A48">ZZZ</div><span class="nm">젠레스 존 제로</span><div class="rt"><b>22,450원</b><span class="up">+3.10%</span></div></div>
  <div class="r"><span class="rk">5</span><div class="ic" style="background:#E0663A">SR</div><span class="nm">붕괴: 스타레일</span><div class="rt"><b>40,650원</b><span class="down">−2.05%</span></div></div>
</div>
<div class="tab"><div class="on"><i></i>홈</div><div><i></i>시장</div><div><i></i>뉴스</div><div><i></i>랭킹</div><div><i></i>내 계좌</div></div>
</body></html>
